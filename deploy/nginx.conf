# Round-robin load balancer in front of N scaled `api` replicas.
# Using Docker's embedded DNS (127.0.0.11) with a variable proxy_pass forces
# nginx to re-resolve `api` on every request, so traffic spreads across all
# replicas created by `docker compose up --scale api=N`.
worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;

    server {
        listen 80;

        location / {
            set $backend "http://api:8000";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
